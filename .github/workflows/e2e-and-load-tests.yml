name: GramVoice E2E & Load Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated E2E and Load Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Run Linter Validation
        run: npm run lint

      - name: Verify Production Build Compilation (TSC & Vite)
        run: npm run build

      - name: Install Selenium Web E2E Dependencies
        run: |
          cd e2e-testing
          npm install

      - name: Install Appium Mobile Screen Dependencies
        run: |
          cd appium-tests
          npm install

      - name: Run Web Selenium E2E Suite
        run: |
          cd e2e-testing
          node run-all.js

      - name: Run Appium Mobile Screens Suite
        run: |
          cd appium-tests
          node run-appium.js

      - name: Run Concurrency Load Testing Suite
        run: |
          cd e2e-testing
          node load-test/load-tester.js

      - name: Upload Excel Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gramvoice-excel-reports
          path: |
            e2e-testing/reports/*.xlsx
            appium-tests/reports/*.xlsx
          retention-days: 14
